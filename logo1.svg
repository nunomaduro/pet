<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />
  
  <g transform="translate(400, 400)">
    <!-- Base Shield Shape Definition Layer -->
    <path d="M -180,-140 C -180,-140 -90,-190 0,-240 C 90,-190 180,-140 180,-140 C 180,30 110,180 0,260 C -110,180 -180,30 -180,-140 Z" 
          fill="none" stroke="#2B6CB0" stroke-width="14" stroke-linejoin="round" opacity="0.15" />

    <!-- Central Tech Gear Components -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="#1A365D" stroke-width="36" />
    <g fill="#1A365D">
      <!-- Gear Teeth -->
      <rect x="-22" y="-140" width="44" height="40" rx="6" transform="rotate(0)" />
      <rect x="-22" y="-140" width="44" height="40" rx="6" transform="rotate(45)" />
      <rect x="-22" y="-140" width="44" height="40" rx="6" transform="rotate(90)" />
      <rect x="-22" y="-140" width="44" height="40" rx="6" transform="rotate(135)" />
      <rect x="-22" y="-140" width="44" height="40" rx="6" transform="rotate(180)" />
      <rect x="-22" y="-140" width="44" height="40" rx="6" transform="rotate(225)" />
      <rect x="-22" y="-140" width="44" height="40" rx="6" transform="rotate(270)" />
      <rect x="-22" y="-140" width="44" height="40" rx="6" transform="rotate(315)" />
    </g>
    <!-- Inner cutout for gear structure -->
    <circle cx="0" cy="0" r="74" fill="#ffffff" />

    <!-- Outer Security Shield Arch (Left Profile) -->
    <path d="M -180,-140 C -180,-140 -90,-190 0,-240 C 0,-240 0,-240 0,-240 C -40,-130 -40,110 0,260 C -110,180 -180,30 -180,-140 Z" 
          fill="none" stroke="#319795" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Network Dependency Nodes & Track Tracks (Left Core Overlay) -->
    <path d="M -180, -30 L -120, 60" fill="none" stroke="#2B6CB0" stroke-width="14" stroke-linecap="round" />
    <circle cx="-180" cy="-30" r="18" fill="#ffffff" stroke="#2B6CB0" stroke-width="12" />
    <circle cx="-120" cy="60" r="18" fill="#ffffff" stroke="#2B6CB0" stroke-width="12" />
    <circle cx="-60" cy="-190" r="18" fill="#ffffff" stroke="#319795" stroke-width="12" />
    <circle cx="-145" cy="-115" r="18" fill="#ffffff" stroke="#319795" stroke-width="12" />

    <!-- Dynamic Validation Checkmark & Growth Arrow Dynamic Line -->
    <!-- Passing perfectly out from the center validating the codebase -->
    <path d="M -50,-10 L -10,35 L 260,-220" fill="none" stroke="#3182CE" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Dynamic inner track for vector styling -->
    <path d="M -50,-10 L -10,35 L 250,-212" fill="none" stroke="#63B3ED" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Arrow Head Terminal pointing upper right -->
    <polygon points="220,-245 285,-245 285,-180" fill="#3182CE" transform="rotate(5, 260, -220)" />
    
    <!-- Central Node Point along the Validation Arrow -->
    <circle cx="110" cy="-85" r="22" fill="#ffffff" stroke="#3182CE" stroke-width="12" />
  </g>
</svg>
